<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DH88 - We are ONE</title>
    <!-- PeerJS for P2P WebRTC online multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/playok.css?v=1790773962">
</head>
<body>
    <div class="playok-container">
        <!-- Main Board Area -->
        <div class="playok-board-area" id="board-area">
            <div id="board-wrapper" class="board-wrapper">
                <div id="goban-board" class="goban-board"></div>
                <button id="btn-sit-board" class="btn-sit-board">chọn nơi</button>
                <div class="cards-area" id="cards-area" style="position: absolute; left: 100%; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; margin-left: 20px;">
                    <div class="hand-slot" id="hand-1" style="text-align: center;">
                        <div class="swap-card-container" id="card-1" style="display: none;">
                            <img src="img/swap_card.jpg" class="swap-card" title="Bài Hoán Đổi (Mất lượt)" style="width: 80px; height: 80px; border-radius: 8px;">
                        </div>
                    </div>
                    <div class="hand-slot" id="hand-2" style="text-align: center;">
                        <div class="swap-card-container" id="card-2" style="display: none;">
                            <img src="img/swap_card.jpg" class="swap-card" title="Bài Hoán Đổi (Mất lượt)" style="width: 80px; height: 80px; border-radius: 8px;">
                        </div>
                    </div>
                </div>
            </div>
            
        </div>

        <!-- Sidebar Area -->
        <div class="playok-sidebar">
            <div class="sidebar-header">
                <span id="room-title">bàn #</span>
                <span id="room-time">5p</span>
                <div class="header-controls">
                    <button id="btn-minimize">-</button>
                    <button id="btn-close">X</button>
                </div>
            </div>

            <div class="players-area">
                <div class="player-slot" id="slot-1">
                    <div class="slot-header"><span class="piece-icon black"></span> #1</div>
                    <div class="slot-content">
                        <button class="btn-sit" id="btn-sit-1" data-color="X">#1</button>
                        <div class="player-name" id="name-1" style="display: none;"></div>
                    </div>
                    <div class="slot-timer" id="timer-1">0:00</div>
                </div>
                <div class="player-slot" id="slot-2">
                    <div class="slot-header"><span class="piece-icon white"></span> #2</div>
                    <div class="slot-content">
                        <button class="btn-sit" id="btn-sit-2" data-color="O">#2</button>
                        <div class="player-name" id="name-2" style="display: none;"></div>
                    </div>
                    <div class="slot-timer" id="timer-2">0:00</div>
                </div>
            </div>

            <div class="actions-area">
                <button id="btn-draw" class="btn-action">một trận hòa</button>
                <button id="btn-undo" class="btn-action">lùi lại</button>
                <button id="btn-resign" class="btn-action">đầu hàng</button>
                <button id="btn-new-game" class="btn-action">ván mới</button>
                <!-- Modeless / Settings -->
                <button id="btn-online" class="btn-action">Tạo phòng / Vào phòng</button>
            </div>

            <div class="tabs-area">
                <div class="tabs-header">
                    <div class="tab-btn active" data-tab="chat">nói</div>
                    <div class="tab-btn" data-tab="moves">nước cờ</div>
                    <div class="tab-btn" data-tab="players">ai trong</div>
                    <div class="tab-btn" data-tab="rules">luật</div>
                </div>
                <div class="tabs-content">
                    <div class="tab-pane active" id="tab-chat">
                        <div class="chat-log" id="chat-log">
                            <div class="chat-sys">+ chào mừng đến với DH88</div>
                        </div>
                        <div class="chat-input-area">
                            <button class="btn-emoji" id="btn-emoji">...</button>
                            <input type="text" id="chat-input" placeholder="nhập tin nhắn...">
                        </div>
                    </div>
                    <div class="tab-pane" id="tab-moves" style="padding:5px; font-size:12px;"></div>
                    <div class="tab-pane" id="tab-players" style="padding:5px; font-size:12px;"></div>
                    <div class="tab-pane" id="tab-rules" style="padding:5px; font-size:12px;">
                        Luật chơi Caro (Gomoku):<br>
                        - Thắng: 5 quân liên tiếp (Ngang, dọc, chéo).<br>
                        - Không tính thắng nếu bị chặn cả 2 đầu.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Minimal popup for joining room since we removed the big modal -->
    <div id="online-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center;">
        <div style="background:white; padding:20px; border: 1px solid black; width: 300px;">
            <h3>Online</h3>
            <p>Tạo phòng mới:</p>
            <select id="online-time-select" style="width:100%; margin-bottom:10px;">
                <option value="30">30s</option>
                <option value="60">60s</option>
                <option value="0">Không giới hạn</option>
            </select>
            <button id="btn-create-room" style="width:100%; margin-bottom: 20px;">Tạo phòng</button>
            <p>Vào phòng:</p>
            <input type="text" id="input-join-code" placeholder="Mã phòng..." style="width:100%; margin-bottom:10px;">
            <button id="btn-join-room" style="width:100%;">Vào</button>
            <button id="btn-close-online" style="margin-top:20px; width:100%;">Đóng</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/vendor/confetti.min.js?v=1790773962"></script>
    <script src="js/audio.js?v=1790773962"></script>
    <script src="js/caro-rules.js?v=1790773962"></script>
    <script src="js/caro-ai.js?v=1790773962"></script>
    <script src="js/online-p2p.js?v=1790773962"></script>
    <script src="js/game.js?v=1790773962"></script>
</body>
</html>
